<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Politique de sécurité : la page ne charge et ne contacte QUE son propre site
       ('self') — aucun script, style, police, image ni envoi de données vers un
       autre domaine, même en cas de bug ou de bibliothèque compromise. Pas de
       script ni de style écrits dans la page, pas d'eval. GitHub Pages ne permet
       pas de régler les en-têtes HTTP : d'où cette balise, placée en premier. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests de non-régression</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="tests.css">
  <script type="module" src="tests.js"></script>
</head>
<body>
  <h1>Tests de non-régression</h1>
  <p>
    Compare la version JavaScript aux résultats produits par <code>app.py</code>
    (<code>script_reference_js.py</code>). Page de développement, à ouvrir en local :
    lancer <code>python3 -m http.server</code> <strong>à la racine du projet</strong>,
    puis <code>http://localhost:8000/web/tests/tests.html</code>.
  </p>
  <p id="bilan" class="bilan">Tests en cours…</p>
  <div id="groupes"></div>
</body>
</html>
